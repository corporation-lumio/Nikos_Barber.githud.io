<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso barbero — La Navaja</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-wrap { width: 100%; max-width: 400px; padding: 24px; }
  .login-marca { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 34px; }
  .login-marca span { font-size: 22px; }
  .login-card {
    background: var(--negro-alt);
    border: 1px solid var(--linea);
    border-radius: 8px;
    padding: 34px 30px;
    box-shadow: var(--sombra);
  }
  .login-card h1 { font-size: 22px; margin-bottom: 6px; text-align:center; }
  .login-card p.sub { color: var(--tinta); font-size: 14px; text-align:center; margin-bottom: 26px; }
  .ayuda {
    margin-top: 20px;
    font-size: 12px;
    color: var(--tinta);
    text-align: center;
    border-top: 1px dashed var(--linea);
    padding-top: 16px;
  }
  .volver { display:block; text-align:center; margin-top:20px; font-size:13px; color:var(--tinta); text-decoration:none; }
  .volver:hover { color: var(--dorado); }
  .error-msg {
    display: none;
    background: rgba(154,59,59,0.15);
    border: 1px solid rgba(184,110,110,0.3);
    color: #e19a9a;
    padding: 10px 12px;
    border-radius: var(--radio);
    font-size: 13px;
    margin-bottom: 18px;
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-marca">
    <div class="pole"></div>
    <span class="display">La Navaja</span>
  </div>

  <div class="login-card">
    <h1>Acceso de barbero</h1>
    <p class="sub">Entra para ver y gestionar tus citas del día.</p>

    <div class="error-msg" id="error-msg">Usuario o contraseña incorrectos.</div>

    <form id="form-login">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" required autocomplete="username" placeholder="barbero">
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-dorado" style="width:100%;">Entrar</button>
    </form>

    <div class="ayuda">
      Demo: usuario <strong class="mono">barbero</strong> · clave <strong class="mono">navaja123</strong><br>
      (cámbialo en <span class="mono">data.js</span>)
    </div>
  </div>

  <a href="index.html" class="volver">&larr; Volver al sitio</a>
</div>

<script src="data.js"></script>
<script>
  if (DB.haySesion()) {
    window.location.href = 'admin.html';
  }

  document.getElementById('form-login').addEventListener('submit', (e) => {
    e.preventDefault();
    const usuario = document.getElementById('usuario').value.trim();
    const clave = document.getElementById('clave').value;
    const errorMsg = document.getElementById('error-msg');

    if (DB.iniciarSesion(usuario, clave)) {
      window.location.href = 'admin.html';
    } else {
      errorMsg.style.display = 'block';
    }
  });
</script>

</body>
</html>
